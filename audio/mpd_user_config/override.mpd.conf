# mpd configuration file
database {
  plugin "simple"
  path "/db/tag_cache"
}
music_directory "/music"
playlist_directory "/playlists"
state_file "/db/state"
state_file_interval "10"
sticker_file "/db/sticker"
bind_to_address "0.0.0.0"
port "6600"
log_file "/log/mpd.log"
zeroconf_enabled "no"
decoder {
  plugin "wildmidi"
  enabled "no"
}
input {
  plugin "curl"
}
decoder {
  plugin "hybrid_dsd"
  enabled "no"
}
audio_output {
  type "pulse"
  name "PulseAudio"
  server "unix:/pipewire/pulse/native"
}
replaygain "off"
replaygain_preamp "0"
replaygain_missing_preamp "0"
replaygain_limit "yes"
volume_normalization "no"
filesystem_charset "UTF-8"
