name: torrent

services:
  gluetun:
    image: qmcgaw/gluetun:latest # TODO: switch to v3 tag once version newer than v3.41 is released
    container_name: gluetun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WIREGUARD_PRIVATE_KEY}
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE='{"auth":"none"}'
      - UPDATER_PERIOD=24h
    ports:
      - '0.0.0.0:7878:7878'
      - '0.0.0.0:8989:8989'
      - '0.0.0.0:9091:9091'
      - '0.0.0.0:9696:9696'
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

  prowlarr:
    image: linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    depends_on:
      - gluetun
    volumes:
      - ${PROWLARR_CONFIG}:/config
    environment:
      - PUID=${UID}
      - PGID=${GID}
    network_mode: 'service:gluetun'
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:6.3.0
    container_name: radarr
    depends_on:
      - gluetun
    volumes:
      - ${RADARR_CONFIG}:/config
      - ${MEDIA_DATA_DIR}:/data
    environment:
      - PUID=${UID}
      - PGID=${GID}
    network_mode: 'service:gluetun'
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:4.0.19
    container_name: sonarr
    depends_on:
      - gluetun
    volumes:
      - ${SONARR_CONFIG}:/config
      - ${MEDIA_DATA_DIR}:/data
    environment:
      - PUID=${UID}
      - PGID=${GID}
    network_mode: 'service:gluetun'
    restart: unless-stopped

  transmission:
    image: linuxserver/transmission:4.1.3
    container_name: transmission
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - ${TRANSMISSION_CONFIG}:/config
      - ${MEDIA_DATA_DIR}:/data
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - USER=${TRANSMISSION_USERNAME}
      - PASS=${TRANSMISSION_PASSWORD}
      - DOCKER_MODS=ghcr.io/michsior14/docker-mods:transmission-gluetun-port-update-v1.4.0
    network_mode: 'service:gluetun'
    restart: unless-stopped
