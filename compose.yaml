name: home-assistant

services:
  bluez-speaker:
    image: wgraj/bluez-speaker:0.1.1
    container_name: bluez-speaker
    volumes:
      - /var/run/dbus:/var/run/dbus
      - bluetooth:/var/lib/bluetooth
    environment:
      - NAME=wgraj-speaker
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
    network_mode: host
    cap_add:
      - NET_ADMIN

  cups:
    image: chuckcharlie/cups-avahi-airprint:2.1.3
    container_name: cups
    volumes:
      - ${CUPS_CONFIG}:/config
    environment:
      CUPSADMIN: ${CUPSADMIN}
      CUPSPASSWORD: ${CUPSPASSWORD}
      AVAHI_HOSTNAME: "printer"
    network_mode: host
    devices:
      - /dev/bus/usb:/dev/bus/usb

  gluetun:
    image: qmcgaw/gluetun:latest # TODO: switch to v3 tag once version newer than v3.41 is released
    container_name: gluetun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WIREGUARD_PRIVATE_KEY}
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE='{"auth":"none"}'
      - UPDATER_PERIOD=24h
    ports:
      - '0.0.0.0:7878:7878'
      - '0.0.0.0:8989:8989'
      - '0.0.0.0:9091:9091'
      - '0.0.0.0:9696:9696'
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

  home-assistant:
    image: homeassistant/home-assistant:2026.7
    container_name: home-assistant
    volumes:
      - ${HOME_ASSISTANT_DIR}:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_1c807dde7bc2ef119728c0138148b910-if00-port0:/dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_1c807dde7bc2ef119728c0138148b910-if00-port0

  jellyfin:
    image: jellyfin/jellyfin:12.0-rc2
    container_name: jellyfin
    volumes:
      - ${JELLYFIN_CONFIG}:/config
      - ${JELLYFIN_CACHE}:/cache
      - ${MEDIA_DATA_DIR}:/data
    network_mode: host
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    user: ${UID}:${GID}
    group_add:
      - "${RENDER_GID}"
      - "${VIDEO_GID}"
    devices:
      - /dev/dri:/dev/dri

  mpd:
    image: giof71/mpd-alsa:vanilla-trixie-0.24.4
    container_name: mpd
    volumes:
      - ${MEDIA_DATA_DIR}/music:/music:ro
      - ${MEDIA_DATA_DIR}/playlists:/playlists
      - ${MPD_DB}:/db
      - pipewire:/pipewire
      - ./mpd_user_config:/user/config
    environment:
      - USER_MODE=Y
      - PUID=${UID}
      - PGID=${GID}
      - AUDIO_GID=29
      - PULSE_AUDIO_OUTPUT_CREATE=yes
    network_mode: host

  pipewire:
    image: wgraj/pipewire:0.1.0
    container_name: pipewire
    volumes:
      - pipewire:/pipewire
      - /run/udev:/run/udev:ro
      - /var/run/dbus:/var/run/dbus:ro
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - BLUETOOTH_A2DP=1
    network_mode: host
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    devices:
      - /dev/snd:/dev/snd
    ulimits:
      rtprio: 95
      memlock: -1

  prowlarr:
    image: linuxserver/prowlarr:2.4.0
    container_name: prowlarr
    depends_on:
      - gluetun
    volumes:
      - ${PROWLARR_CONFIG}:/config
    environment:
      - PUID=${UID}
      - PGID=${GID}
    network_mode: 'service:gluetun'

  radarr:
    image: linuxserver/radarr:6.2.1
    container_name: radarr
    depends_on:
      - gluetun
    volumes:
      - ${RADARR_CONFIG}:/config
      - ${MEDIA_DATA_DIR}:/data
    environment:
      - PUID=${UID}
      - PGID=${GID}
    network_mode: 'service:gluetun'

  sonarr:
    image: linuxserver/sonarr:4.0.19
    container_name: sonarr
    depends_on:
      - gluetun
    volumes:
      - ${SONARR_CONFIG}:/config
      - ${MEDIA_DATA_DIR}:/data
    environment:
      - PUID=${UID}
      - PGID=${GID}
    network_mode: 'service:gluetun'

  transmission:
    image: linuxserver/transmission:4.1.3
    container_name: transmission
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - ${TRANSMISSION_CONFIG}:/config
      - ${MEDIA_DATA_DIR}:/data
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - USER=${TRANSMISSION_USERNAME}
      - PASS=${TRANSMISSION_PASSWORD}
      - DOCKER_MODS=ghcr.io/michsior14/docker-mods:transmission-gluetun-port-update-v1.4.0
    network_mode: 'service:gluetun'

  wireguard:
    image: linuxserver/wireguard:1.0.20250521
    container_name: wireguard
    volumes:
      - ${WG_CONFIG_DIR}:/config
    environment:
      - PUID=${UID}
      - PGID=${GID}
    network_mode: host
    cap_add:
      - NET_ADMIN

volumes:
  pipewire:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

  bluetooth:
