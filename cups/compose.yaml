name: cups

services:
  cups:
    image: chuckcharlie/cups-avahi-airprint:2.1.3
    container_name: cups
    volumes:
      - ${CUPS_CONFIG}:/config
    environment:
      CUPSADMIN: ${CUPSADMIN}
      CUPSPASSWORD: ${CUPSPASSWORD}
      AVAHI_HOSTNAME: "printer"
    network_mode: host
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
