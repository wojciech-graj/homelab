name: jellyfin

services:
  jellyfin:
    image: jellyfin/jellyfin:12.0-rc2
    container_name: jellyfin
    volumes:
      - ${JELLYFIN_CONFIG}:/config
      - ${JELLYFIN_CACHE}:/cache
      - ${MEDIA_DATA_DIR}:/data
    network_mode: host
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    user: ${UID}:${GID}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID}"
      - "${VIDEO_GID}"
